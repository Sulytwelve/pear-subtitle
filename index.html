<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>梨字幕 · 离线字幕检查器</title><style>
*{box-sizing:border-box}body{margin:0;background:#17171f;color:#f6eff4;font-family:'Microsoft YaHei',sans-serif}main{max-width:1440px;margin:auto;padding:42px 52px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:34px;margin:0 0 8px}p{color:#c3b5c6;font-size:16px;line-height:1.8}.tag{color:#8fe6d0;border:1px solid #3d635a;border-radius:30px;padding:9px 18px}.brand{font-size:13px;letter-spacing:3px;color:#f3adca;margin-bottom:15px}button,label.btn{font:inherit;background:#292630;border:1px solid #504153;color:#f6eff4;border-radius:9px;padding:11px 17px;cursor:pointer;display:inline-block;margin-right:8px}button.primary{background:#edb1c8;color:#271e29;border:0;font-weight:bold}button:hover,label.btn:hover{filter:brightness(1.12)}.toolbar{margin:26px 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:#22212b;border:1px solid #39323f;border-radius:16px;padding:24px}h2{margin:0 0 14px;font-size:21px}textarea{width:100%;height:395px;resize:vertical;background:#18171f;border:1px solid #453746;border-radius:9px;color:#e9deeb;line-height:1.7;padding:18px;font:15px/1.7 Consolas,'Microsoft YaHei',monospace}.metrics{display:flex;gap:12px;margin:0 0 18px}.metric{flex:1;background:#302733;border-radius:10px;padding:12px 16px}.metric b{font-size:30px;display:block;color:#f4bbd1}.metric span{color:#c4b3c9;font-size:13px}.issue{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #39323f;font-size:15px;line-height:1.5}.issue em{font-style:normal;white-space:nowrap;color:#ffb09d}.issue.warning em{color:#e7cf96}.ok{color:#8fe6d0;padding:35px 0;font-size:22px}footer{display:flex;justify-content:space-between;font-size:13px;color:#a495af;margin-top:24px}.note{font-size:13px;margin:12px 0 0}#file{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0}@media(max-width:800px){main{padding:24px}.grid{grid-template-columns:1fr}header{gap:12px}.tag{font-size:12px}.toolbar button{margin-bottom:8px}footer{display:block}}
</style><main><div class="brand">LYXII LAB / EXPERIMENT 01</div><header><div><h1>梨字幕 <span style="color:#c6a7d8">.srt</span></h1><p style="margin:0">投稿之前，给字幕做一次体检。</p></div><span class="tag">离线运行 · 无需 API</span></header>
<div class="toolbar"><button id="sample">载入带错样例</button><button id="fixed">载入修订样例</button><label class="btn" for="file">打开 SRT 文件</label><input type="file" id="file" accept=".srt,text/plain"><button class="primary" id="check">检查字幕</button><button id="export">导出检查报告</button></div>
<div class="grid"><section class="panel"><h2>字幕原文</h2><textarea id="source" aria-label="字幕原文" spellcheck="false"></textarea><p class="note">仅检查，不自动改写原文。修订样例是预先人工调整的演示数据。</p></section><section class="panel"><h2>检查结果</h2><div class="metrics"><div class="metric"><b id="count">0</b><span>条字幕</span></div><div class="metric"><b id="errors">0</b><span>项错误</span></div><div class="metric"><b id="warnings">0</b><span>项提示</span></div></div><div id="issues" aria-live="polite">载入或粘贴字幕，然后点击检查。</div></section></div>
<footer><span>梨希 Lyxii · 本期开发原型 v0.1</span><span>阈值只是检查建议，不能代替观看判断。</span></footer></main><script src="checker.js"></script><script>
const bad=`1\n00:00:00,000 --> 00:00:02,000\n让 AI 试着养活自己。\n\n3\n00:00:01,800 --> 00:00:03,600\n先把字幕做对。\n\n3\n00:00:04,000 --> 00:00:03,500\n时间怎么倒着走？\n\n4\n00:00:04,200 --> 00:00:04,500\n这一大长串字幕只给零点三秒真的来得及看完吗？`;
const good=`1\n00:00:00,000 --> 00:00:02,000\n让 AI 试着养活自己。\n\n2\n00:00:02,000 --> 00:00:04,000\n先把字幕做对。\n\n3\n00:00:04,000 --> 00:00:06,000\n这次时间顺序正常了。\n\n4\n00:00:06,000 --> 00:00:09,000\n字幕也要喘口气。`;
const el=id=>document.getElementById(id);let latest=null;
function run(){latest=PearSRT.inspect(el('source').value);['count','errors','warnings'].forEach(k=>el(k).textContent=latest[k]);el('issues').replaceChildren();if(!latest.issues.length){const p=document.createElement('div');p.className='ok';p.textContent='✓ 未发现规则内的问题';el('issues').append(p);}latest.issues.forEach(x=>{const p=document.createElement('div');p.className='issue '+x.type;const tag=document.createElement('em');tag.textContent=x.cue?`第 ${x.cue} 条`:'文件';const t=document.createElement('span');t.textContent=x.message;p.append(tag,t);el('issues').append(p);});}
el('sample').onclick=()=>{el('source').value=bad;run()};el('fixed').onclick=()=>{el('source').value=good;run()};el('check').onclick=run;
el('file').onchange=async e=>{const f=e.target.files[0];if(f){el('source').value=await f.text();run()}};
el('export').onclick=()=>{run();const blob=new Blob([JSON.stringify(latest,null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='pear-srt-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></html>
